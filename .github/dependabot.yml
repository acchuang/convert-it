version: 2
updates:
  # Weekly, grouped, so upgrades arrive as one reviewable PR rather than a
  # stream. After merging anything that touches @jsquash/*, @resvg/resvg-wasm or
  # @hyzyla/pdfium, run `npm run copy-wasm` (see AGENTS.md); an @ffmpeg/core
  # bump also needs the R2 upload and new FFMPEG_CORE_SHA256 values.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
