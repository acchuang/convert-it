name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      # The smoke suite drives the runner's preinstalled Google Chrome, so
      # Playwright's own browser download is skipped.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run typecheck

      - run: npm run lint

      - run: npx prettier --check .

      # The codec, PDFium, resvg and OCR files under public/ are committed
      # copies of node_modules files: fail if an upgrade left them stale.
      - run: npm run copy-wasm -- --check

      # W3C epubcheck (Java, preinstalled on the runner) validates every EPUB
      # the converters produce; the test runs only when EPUBCHECK_JAR is set.
      # Pinned by hash like any other executable we download.
      - name: Fetch epubcheck
        run: |
          curl -sSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          echo "0532f6291faa2bb729dd253f958868a2a57dbd2c32f881a97c7c980c5940309e  /tmp/epubcheck.zip" | sha256sum -c -
          unzip -q /tmp/epubcheck.zip -d /tmp

      - run: npm run test
        env:
          EPUBCHECK_JAR: /tmp/epubcheck-5.2.1/epubcheck.jar

      # Runtime dependencies only: every one of them parses untrusted files in
      # the user's browser. Dev tooling advisories are handled by Dependabot.
      - run: npm audit --omit=dev --audit-level=high

      # postbuild adds the CSP (out/_headers + per-page hashes).
      # Public CDN URL, inlined into the bundle at build time — not a secret.
      # Must match the value in the Pages project's env vars; the generated CSP
      # allows its origin in connect-src. Scoped to this step on purpose: the
      # unit tests must run without it (they would otherwise hit the real CDN).
      - run: npm run build
        env:
          NEXT_PUBLIC_FFMPEG_BASE_URL: https://cdn.oilygold.xyz/ffmpeg-core/0.12.10

      # Real codecs in a real browser against the built site with its _headers
      # applied. Checks the downloaded bytes, and fails on any CSP violation.
      # Port 3000 is in the R2 bucket's CORS allowlist, so FFmpeg loads from the
      # production CDN and its pinned hash is checked on every run.
      - name: Browser smoke suite
        run: |
          npm run fixtures
          node scripts/serve-out.mjs 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/smoke.mjs
          # Service worker offline behaviour; runs its own server on port 3100,
          # which it stops to go offline for real.
          node scripts/offline-smoke.mjs

      # The Pages project is direct-upload (no Git integration), so main is
      # deployed from the artifact this job just built and verified.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name convert-it --branch main
